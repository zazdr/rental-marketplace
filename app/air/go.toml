root = "./"
tmp_dir = "./tmp/"

[build]

cmd = "go build -o ./tmp/app ./cmd"
full_bin = "set -a && . ./env/.env.dev && ./tmp/app"

include_ext = ["go"]
include_file = ["./go.mod", "./go.sum"]
exclude_unchanged = true
delay = 2000

[proxy]

enabled = true
app_port = 4000
proxy_port = 4040
proxy_host = "0.0.0.0"
